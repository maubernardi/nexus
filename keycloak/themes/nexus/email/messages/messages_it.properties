# Testi delle email di NEXUS sopra quelli italiani di Keycloak (file in UTF-8). La firma «Portale Nexus» chiude ogni
# testo semplice qui; nelle email HTML la aggiunge html/template.ftl.

# Oggetti: TUTTI iniziano con «PORTALE NEXUS - » (richiesta del PO del 07/11), anche quelli di email che NEXUS oggi non
# usa, così una funzione di Keycloak attivata in futuro non manda un oggetto senza prefisso.
emailVerificationSubject=PORTALE NEXUS - Verifica l''indirizzo email
emailTestSubject=PORTALE NEXUS - Messaggio di prova
identityProviderLinkSubject=PORTALE NEXUS - Collegamento {0}
passwordResetSubject=PORTALE NEXUS - Reimposta la password
executeActionsSubject=PORTALE NEXUS - Modifica il tuo utente
eventLoginErrorSubject=PORTALE NEXUS - Errore di accesso
eventRemoveTotpSubject=PORTALE NEXUS - Rimozione OTP (password temporanea valida una volta sola)
eventUpdatePasswordSubject=PORTALE NEXUS - Aggiornamento password
eventUpdateTotpSubject=PORTALE NEXUS - Aggiornamento OTP (password temporanea valida una volta sola)
emailUpdateConfirmationSubject=PORTALE NEXUS - Verifica il nuovo indirizzo email
eventUserDisabledByTemporaryLockoutSubject=PORTALE NEXUS - Utente disabilitato con un blocco temporaneo
eventUserDisabledByPermanentLockoutSubject=PORTALE NEXUS - Utente disabilitato con blocco permanente
eventRemoveCredentialSubject=PORTALE NEXUS - Rimozione credenziali
eventUpdateCredentialSubject=PORTALE NEXUS - Le tue credenziali sono state cambiate
orgInviteSubject=PORTALE NEXUS - Invito per unirti all''organizzazione {0}
accountNotificationSubject=PORTALE NEXUS - Notifica utente
accountDisableNotificationSubject=PORTALE NEXUS - Avviso di disattivazione dell''utente
accountDeleteNotificationSubject=PORTALE NEXUS - Notifica di cancellazione dell''utente
verifiableCredentialOfferSubject=PORTALE NEXUS - Offerta di credenziale verificabile

# Corpi
passwordResetBody=Qualcuno ha appena richiesto di cambiare le credenziali di accesso al tuo utente {2}. Se sei stato tu, clicca sul collegamento seguente per reimpostarle.\n\n{0}\n\nQuesto collegamento scadrà entro {3}.\n\nSe non vuoi reimpostare le tue credenziali di accesso, ignora pure questo messaggio: non verrà effettuata alcuna modifica.\n\nPortale Nexus
executeActionsBody=L''amministratore ha appena richiesto un aggiornamento del tuo utente {2} ed è necessario che tu esegua la/le seguente/i azione/i: {3}. Clicca sul collegamento seguente per iniziare questo processo.\n\n{0}\n\nQuesto collegamento scadrà entro {4}.\n\nSe non sei a conoscenza della richiesta dell''amministratore, ignora pure questo messaggio: non verrà effettuata alcuna modifica.\n\nPortale Nexus
emailVerificationBody=Qualcuno ha creato un utente {2} con questo indirizzo email. Se sei stato tu, clicca sul collegamento seguente per verificarlo\n\n{0}\n\nQuesto collegamento scadrà entro {3}.\n\nSe non sei stato tu a creare questo utente, ignora pure questo messaggio.\n\nPortale Nexus
emailTestBody=Questo è un messaggio di prova.\n\nPortale Nexus
eventUpdatePasswordBody=La tua password è stata cambiata il {0} da {1}. Se non sei stato tu, per favore contatta l''amministratore.\n\nPortale Nexus

# Cambio della password (UPDATE_CREDENTIAL): parametri dai template event-update_credential.ftl di questo tema
# {0} username, {1} data, {2} ora (fuso di Roma), {3} indirizzo IP
eventUpdateCredentialBody={0}, le tue credenziali sono state cambiate il {1} alle {2} da questo indirizzo IP: {3}\nSe non sei stato tu, per favore contatta l''amministratore.\n\nPortale Nexus
eventUpdateCredentialBodyHtml=<p>{0}, le tue credenziali sono state cambiate il {1} alle {2} da questo indirizzo IP: {3}</p><p>Se non sei stato tu, per favore contatta l''amministratore.</p>
