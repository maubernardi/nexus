spring:
  application:
    name: nexus-backend
  profiles:
    active: ${PROFILES_ACTIVE:local}
    group:
      local: postgresql, security-mock, seed
      keycloak: postgresql, keycloak
      test: security-mock
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      # schema applicativo anche per le query SQL native (non solo per Hibernate)
      schema: nexus
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nexus
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    schemas: nexus
    default-schema: nexus
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  # email delle notifiche (US-1202): SMTP IONOS con STARTTLS; la password solo nel .env del server (NEXUS_SMTP_PASSWORD)
  mail:
    host: ${MAIL_HOST:smtp.ionos.it}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:admin@portalenexus.it}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # l'SMTP non decide se il backend è pronto: un invio fallito si registra nel log, l'app continua
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${OPENAPI_ENABLED:true}
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}

nexus:
  # controllo del timer delle proposte accettate (US-704/705): ogni ora, ora di Roma; "-" lo disattiva
  timer:
    cron: ${TIMER_CRON:0 5 * * * *}
  # conservazione dei dati dei beneficiari (US-1303): ogni notte alle 2:30, ora di Roma; "-" lo disattiva
  retention:
    cron: ${RETENTION_CRON:0 30 2 * * *}
    period: ${RETENTION_PERIOD:P2Y}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  mail:
    # spente in locale e nei test; in produzione le accende il compose (servono anche la password e l'indirizzo)
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:NEXUS <noreply@portalenexus.it>}
    app-url: ${APP_URL:http://localhost:5173}
