spring:
  application:
    name: nexus-backend
  profiles:
    active: ${PROFILES_ACTIVE:local}
    group:
      local: postgresql, security-mock, seed
      keycloak: postgresql, keycloak
      test: security-mock
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      # schema applicativo anche per le query SQL native (non solo per Hibernate)
      schema: nexus
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nexus
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    schemas: nexus
    default-schema: nexus
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${OPENAPI_ENABLED:true}
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}

nexus:
  # controllo del timer delle proposte accettate (US-704/705): ogni ora, ora di Roma; "-" lo disattiva
  timer:
    cron: ${TIMER_CRON:0 5 * * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
