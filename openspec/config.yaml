schema: spec-driven

context: |
  Progetto: NEXUS — Progressive Web App multi-progetto per l'Area Lavoro e il Call Center Sociale
  di una Cooperativa Sociale (gestione segnalazioni e tirocini). Brief funzionale completo in
  CLAUDE_CODE_PROMPT.md (v5.0): modello ER, FSM del Ticket (Fasi 1-7), RBAC, generazione .docx.

  Ruoli: TUTOR (mobile-first), CALL_CENTER (desktop), ADMIN.

  Stack (sostituisce quello "consigliato" nel brief — Next.js/Prisma/NextAuth NON si usano):
  - Monorepo: backend/ (Java) + frontend/ (React) + infra/ (docker-compose, Keycloak realm).
  - Versioni CONGELATE al 2026-09-27 (ultime stabili, LTS per i runtime): nessun aggiornamento senza richiesta
    esplicita; le nuove dipendenze a versione esatta. Le skill valgono per le convenzioni, non per le versioni.
  - Backend: Java 25 LTS, Spring Boot 4.1 (Spring Framework 7, Security 7, Hibernate 7, Jackson 3), Maven wrapper,
    Spring Web MVC, Spring Data JPA + PostgreSQL 18,
    Flyway (unica fonte dello schema, ddl-auto=validate), Spring Security 7 OAuth2 resource server
    con Keycloak (JWT stateless), profilo security-mock per sviluppo locale, MapStruct, Lombok,
    springdoc-openapi, Testcontainers. Package base it.nexus. Convenzioni skill java-backend
    (Resource -> Service/ServiceImpl -> Repository -> Entity, DTO record, errori via un unico
    @RestControllerAdvice, @PreAuthorize su ogni endpoint, deny by default).
  - Frontend: Node 24.21.0 LTS, React 19.3 + TypeScript 6 strict, Vite 8 (Rolldown), Tailwind CSS v4 + shadcn/ui, Zustand (stato client),
    TanStack Query (stato server), Axios, react-hook-form, React Router 8, i18next (italiano),
    Vitest 5 + Testing Library, ESLint 10, pnpm 12. Atomic design (atoms/molecules/organisms/pages/templates).
    Convenzioni skill react-frontend (named export, niente any, testi via t()).
  - PWA: vite-plugin-pwa (Workbox), manifest installabile, offline shell.
  - Accessibilità: WCAG 2.2 livello AA obbligatorio (contrasto, focus visibile, navigazione da tastiera,
    landmark, skip link, target touch >= 24px, prefers-reduced-motion, lang="it"). Verifica automatica
    con eslint-plugin-jsx-a11y e axe-core nei test.
  - Generazione documenti Word: libreria Java (poi-tl / Apache POI) al posto di docxtemplater.
  - CI: GitHub Actions. Repository: https://github.com/maubernardi/nexus

  Processo: Agile con documenti in docs/agile/ (backlog, roadmap, sprint). Ogni change OpenSpec realizza una o più
  storie del backlog (citarne gli ID, es. US-301, nel proposal); i criteri di accettazione diventano scenari.

  Lingua: il dominio usa i termini del brief (Ticket, Candidate, BoardPost, JobSlot, stati in italiano).
  Documentazione e artefatti OpenSpec in italiano. Conventional commits.

rules:
  proposal:
    - Includere sempre una sezione "Non-goals"
    - Indicare l'impatto su accessibilità (WCAG 2.2 AA) e PWA quando la change tocca il frontend
  tasks:
    - Ogni task deve essere verificabile (build, test o controllo manuale esplicito)
    - Suddividere i task per area (infra, backend, frontend, CI)
