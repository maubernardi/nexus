# Versioni esatte (sempre le più aggiornate, EN-6): pnpm salva sempre versioni esatte; engineStrict vale per le dipendenze.
# Node e pnpm del progetto sono imposti da "devEngines" in package.json (onFail: error).
saveExact: true
engineStrict: true

allowBuilds:
  esbuild: true
  sharp: true

# Deroghe ai peer dependency, verificate con lint/build (vedi openspec/changes/archive/2026-09-27-upgrade-latest-versions/design.md):
# - eslint-plugin-jsx-a11y 6.10.2 (ultima release) dichiara peer fino a ESLint 9 ma funziona in flat config con ESLint 10
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'

# Vulnerabilità nelle dipendenze indirette senza una versione del pacchetto padre che le corregga (EN-6): workbox-build
# 7.4.1 (ultima) chiede glob ^11, vulnerabile fino alla 14.0.1. Forzate alle versioni corrette, verificate con la build
# del service worker. ESLint 10.14 chiede minimatch ^10, vulnerabile: 11 forzato solo in ESLint (verificato con il lint);
# forzato ovunque romperebbe un plugin che usa la vecchia interfaccia. Da togliere quando i pacchetti padre aggiornano.
overrides:
  workbox-build>glob: 14.0.4
  eslint>minimatch: 11.0.5
  '@eslint/config-array>minimatch': 11.0.5
  '@typescript-eslint/typescript-estree>minimatch': 11.0.5
