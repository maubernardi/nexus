name: CI

# Versioni congelate: action fissate per SHA (commento = tag), JDK e Node alle versioni esatte del progetto.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 25 LTS)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # storia completa: il controllo delle migrazioni confronta la PR con il branch di destinazione
          fetch-depth: 0
      - name: Immagini dei test uguali alla produzione (EN-6)
        working-directory: .
        run: tools/ci/check-image-versions.sh
      - name: Migrazioni Flyway (numerazione e immutabilità, EN-5)
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/check-migrations.sh "origin/$BASE_REF"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.5'
          cache: maven
      - name: Build, unit e integration test (Testcontainers)
        run: ./mvnw -B verify

  frontend:
    name: Frontend (React PWA)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint (incl. jsx-a11y)
        run: pnpm lint
      - name: Formattazione
        run: pnpm format:check
      - name: Test (incl. axe WCAG)
        run: pnpm test --run
      - name: Build PWA
        run: pnpm build

  keycloak-theme:
    name: Tema di Keycloak
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Immagine con il tema
        run: docker build -t nexus-keycloak:ci keycloak
      - name: Pagina di accesso con il tema (realm di sviluppo)
        run: |
          docker run -d --name kc -p 8080:8080 -v "$PWD/infra/keycloak:/opt/keycloak/data/import:ro" \
            --add-host=host.docker.internal:host-gateway \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            nexus-keycloak:ci start-dev --import-realm
          for i in $(seq 1 60); do
            curl -fs -o /dev/null http://localhost:8080/realms/nexus/.well-known/openid-configuration && break
            [ "$i" -eq 60 ] && { echo "Keycloak non risponde"; exit 1; }
            sleep 3
          done
          # una richiesta di accesso come quella della PWA (PKCE): la pagina deve usare il tema, solo in italiano
          page=$(curl -fsS -c /tmp/kc-cookies "http://localhost:8080/realms/nexus/protocol/openid-connect/auth?client_id=nexus-frontend&redirect_uri=http%3A%2F%2Flocalhost%3A5173%2F&response_type=code&scope=openid&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256")
          grep -q 'lang="it"' <<<"$page"
          grep -q '<title>Accedi a NEXUS</title>' <<<"$page"
          grep -q 'class="nexus-header"' <<<"$page"
          if grep -q 'login-select-toggle' <<<"$page"; then echo "C'è il selettore della lingua"; exit 1; fi
          css=$(grep -oE '/resources/[^"]+/login/nexus/css/nexus\.css' <<<"$page")
          curl -fsS -o /dev/null "http://localhost:8080$css"
          # US-1308: «Password dimenticata?» porta alla pagina di recupero, anche lei con il tema
          reset=$(grep -oE 'href="[^"]*login-actions/reset-credentials[^"]*"' <<<"$page" | head -n1 | sed -e 's/^href="//' -e 's/"$//' -e 's/&amp;/\&/g')
          [ -n "$reset" ] || { echo "Manca il collegamento per il recupero della password"; exit 1; }
          case $reset in http*) ;; *) reset="http://localhost:8080$reset" ;; esac
          reset_page=$(curl -fsS -b /tmp/kc-cookies "$reset")
          grep -q 'class="nexus-header"' <<<"$reset_page"
          grep -q 'name="username"' <<<"$reset_page"
      - name: Recupero della password con email di sicurezza (US-1308)
        run: |
          kcadm() { docker exec kc /opt/keycloak/bin/kcadm.sh "$@"; }
          kcadm config credentials --server http://localhost:8080 --realm master --user admin --password admin
          # la posta di Keycloak va al server SMTP di prova dello script, su questo host
          kcadm update realms/nexus -s smtpServer.host=host.docker.internal -s smtpServer.port=2525 \
            -s smtpServer.from=noreply@nexus.local -s smtpServer.fromDisplayName=NEXUS
          # EN-7: la stessa policy della demo, con l'elenco delle password comuni dell'immagine
          kcadm update realms/nexus \
            -s 'passwordPolicy=length(12) and notUsername and notEmail and passwordBlacklist(nexus-common-passwords.txt)'
          # al prossimo accesso tutor1 deve aggiornare la password: è il cambio che fa partire l'email di sicurezza
          kcadm update users/00000000-0000-4000-8000-000000000001 -r nexus -s 'requiredActions=["UPDATE_PASSWORD"]'
          python3 -I tools/ci/keycloak-password-reset-e2e.py http://localhost:8080 tutor1 tutor1@nexus.local password
      - name: Log di Keycloak
        if: failure()
        run: docker logs kc

  openspec:
    name: OpenSpec
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict
