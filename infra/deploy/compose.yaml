# NEXUS — stack di produzione/demo. Sul server: /opt/nexus/app (file scaricati dal deploy per il commit pubblicato).
# Variabili da /opt/nexus/.env (segreti, generati da bootstrap.sh) e /opt/nexus/release.env (NEXUS_VERSION).
# Solo `web` pubblica porte verso Internet; gli altri servizi stanno sulla rete interna.
name: nexus-server

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      NEXUS_OWNER_PASSWORD: ${NEXUS_OWNER_PASSWORD:?}
      NEXUS_APP_PASSWORD: ${NEXUS_APP_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HOSTNAME: https://${NEXUS_AUTH_DOMAIN:?}
      # console di amministrazione raggiungibile solo dal server (tunnel SSH), mai tramite il dominio pubblico
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx512m"
      # variabili lette dal realm demo durante l'import (${...} nel JSON)
      NEXUS_DOMAIN: ${NEXUS_DOMAIN:?}
      NEXUS_DEMO_PASSWORD_TUTOR1: ${NEXUS_DEMO_PASSWORD_TUTOR1:?}
      NEXUS_DEMO_PASSWORD_TUTOR2: ${NEXUS_DEMO_PASSWORD_TUTOR2:?}
      NEXUS_DEMO_PASSWORD_OPERATORE: ${NEXUS_DEMO_PASSWORD_OPERATORE:?}
      NEXUS_DEMO_PASSWORD_ADMIN: ${NEXUS_DEMO_PASSWORD_ADMIN:?}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro,Z
    ports:
      # solo loopback del server: per la console usare `ssh -L 8081:127.0.0.1:8081 nexus`
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 1g
    logging: *logging

  backend:
    image: ${NEXUS_REGISTRY:-ghcr.io/maubernardi}/nexus-backend:${NEXUS_VERSION:?}
    restart: unless-stopped
    environment:
      PROFILES_ACTIVE: ${NEXUS_BACKEND_PROFILES:-keycloak,seed}
      DB_URL: jdbc:postgresql://postgres:5432/nexus
      DB_USERNAME: nexus_app
      DB_PASSWORD: ${NEXUS_APP_PASSWORD:?}
      FLYWAY_USERNAME: nexus_owner
      FLYWAY_PASSWORD: ${NEXUS_OWNER_PASSWORD:?}
      KEYCLOAK_ISSUER_URI: https://${NEXUS_AUTH_DOMAIN:?}/realms/nexus
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/nexus/protocol/openid-connect/certs
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      OPENAPI_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 768m
    logging: *logging

  web:
    image: ${NEXUS_REGISTRY:-ghcr.io/maubernardi}/nexus-web:${NEXUS_VERSION:?}
    restart: unless-stopped
    environment:
      NEXUS_DOMAIN: ${NEXUS_DOMAIN:?}
      NEXUS_AUTH_DOMAIN: ${NEXUS_AUTH_DOMAIN:?}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
